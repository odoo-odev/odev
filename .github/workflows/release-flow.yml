name: release-flow

# Reusable release flow shared by odev and its plugins, see docs/contributing/releasing.md.
#
# - sync:     the pre-release branch always exists and always contains the release branch
# - prepare:  the version is bumped on the pre-release branch and a release pull request is kept up-to-date
# - release:  the release branch is fast-forwarded to the pre-release branch, tagged and published
# - retarget: pull requests opened against the release branch are moved to the pre-release branch
#
# Branches are protected: pushes are made by a GitHub App listed in the bypass list of the branch ruleset.

on:
  workflow_call:
    inputs:
      package:
        description: Name of the released package, used in commit messages and titles
        type: string
        required: true
      version-file:
        description: Path to the file assigning `__version__`
        type: string
        default: __manifest__.py
      release-branch:
        description: Branch tracking the latest release
        type: string
        default: main
      prerelease-branch:
        description: Branch collecting the changes of the next release
        type: string
        default: beta
      release:
        description: Release the pre-release branch when the workflow is run manually
        type: boolean
        default: false
      tooling-ref:
        description: Revision of odoo-odev/odev from which the release tooling is fetched
        type: string
        default: main
    secrets:
      app_id:
        description: Identifier of the GitHub App allowed to bypass the branch ruleset
        required: false
      app_private_key:
        description: Private key of the GitHub App allowed to bypass the branch ruleset
        required: false

env:
  PACKAGE: ${{ inputs.package }}
  VERSION_FILE: ${{ inputs.version-file }}
  RELEASE_BRANCH: ${{ inputs.release-branch }}
  PRERELEASE_BRANCH: ${{ inputs.prerelease-branch }}
  TOOLING: .release-tooling/.github/scripts/release.py

jobs:

  credentials:
    name: credentials
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request_target'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: check-app-credentials
        id: check
        env:
          APP_ID: ${{ secrets.app_id }}
          APP_PRIVATE_KEY: ${{ secrets.app_private_key }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Release flow disabled::The release GitHub App is not configured for this repository"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  sync:
    name: sync-${{ inputs.prerelease-branch }}
    runs-on: ubuntu-latest
    needs: credentials
    if: >-
      needs.credentials.outputs.configured == 'true' && (
        github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && !inputs.release)
        || (github.event_name == 'delete' && github.event.ref == inputs.prerelease-branch)
        || (github.event_name == 'push' && github.ref_name == inputs.release-branch)
      )
    concurrency:
      group: release-flow-branches-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: create-app-token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}

      - name: checkout-repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: sync-prerelease-branch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

          release="origin/$RELEASE_BRANCH"
          prerelease="origin/$PRERELEASE_BRANCH"

          if ! git ls-remote --exit-code --heads origin "$PRERELEASE_BRANCH" > /dev/null; then
            git push origin "$release:refs/heads/$PRERELEASE_BRANCH"
            echo "::notice::Created '$PRERELEASE_BRANCH' from '$RELEASE_BRANCH'"
            exit 0
          fi

          if git merge-base --is-ancestor "$release" "$prerelease"; then
            echo "::notice::'$PRERELEASE_BRANCH' already contains '$RELEASE_BRANCH'"
            exit 0
          fi

          if git merge-base --is-ancestor "$prerelease" "$release"; then
            git push origin "$release:refs/heads/$PRERELEASE_BRANCH"
            echo "::notice::Fast-forwarded '$PRERELEASE_BRANCH' to '$RELEASE_BRANCH'"
            exit 0
          fi

          # Both branches diverged: commits were added to the release branch without a fast-forward. Replay on
          # top of the release branch the changes it does not contain yet; version bumps are computed again by
          # the `prepare` job once the branch is pushed.
          echo "::warning::'$PRERELEASE_BRANCH' diverged from '$RELEASE_BRANCH', rebasing it"
          expected=$(git rev-parse "$prerelease")
          git switch --detach "$release"

          for commit in $(git rev-list --reverse --no-merges --cherry-pick --right-only "$release...$prerelease"); do
            case "$(git log -1 --format=%s "$commit")" in
              "[REL]"*) continue ;;
            esac

            if ! git cherry-pick --empty=drop "$commit"; then
              git cherry-pick --abort || true
              title="'$PRERELEASE_BRANCH' diverged from '$RELEASE_BRANCH' and needs a manual repair"

              if [ -z "$(gh issue list --state open --search "in:title $title" --json number --jq '.[].number')" ]; then
                gh issue create --title "$title" --body \
                  "Commit $commit could not be replayed on top of \`$RELEASE_BRANCH\`, see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
              fi

              echo "::error::Cannot replay $commit on top of '$RELEASE_BRANCH'"
              exit 1
            fi
          done

          git push origin "HEAD:refs/heads/$PRERELEASE_BRANCH" \
            --force-with-lease="refs/heads/$PRERELEASE_BRANCH:$expected"
          echo "::notice::Rebased '$PRERELEASE_BRANCH' on top of '$RELEASE_BRANCH'"

  prepare:
    name: prepare-release
    runs-on: ubuntu-latest
    needs: credentials
    if: >-
      needs.credentials.outputs.configured == 'true'
      && github.event_name == 'push'
      && github.ref_name == inputs.prerelease-branch
    concurrency:
      group: release-flow-branches-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: create-app-token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}

      - name: checkout-repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.prerelease-branch }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: checkout-release-tooling
        uses: actions/checkout@v4
        with:
          repository: odoo-odev/odev
          ref: ${{ inputs.tooling-ref }}
          path: .release-tooling
          sparse-checkout: .github/scripts

      - name: bump-version
        id: version
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          release="origin/$RELEASE_BRANCH"

          if ! git merge-base --is-ancestor "$release" HEAD; then
            echo "::warning::'$PRERELEASE_BRANCH' does not contain '$RELEASE_BRANCH', waiting for the branches to be synced"
            exit 0
          fi

          version=$(python3 "$TOOLING" next-version --base "$release" --head HEAD --version-file "$VERSION_FILE")

          if [ -z "$version" ]; then
            echo "::notice::Nothing to release"
            exit 0
          fi

          python3 "$TOOLING" changelog --base "$release" --head HEAD > "$RUNNER_TEMP/changelog.md"
          python3 "$TOOLING" bump --version-file "$VERSION_FILE" --version "$version"

          if ! git diff --quiet -- "$VERSION_FILE"; then
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
            git commit --message "[REL] $PACKAGE: bump the version to $version" -- "$VERSION_FILE"
            git push origin "HEAD:refs/heads/$PRERELEASE_BRANCH"
            echo "::notice::Bumped the version to $version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: update-release-pull-request
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          title="[REL] $PACKAGE: release $VERSION"

          {
            echo "> [!IMPORTANT]"
            echo "> Do **not** merge this pull request with the merge button: it rewrites the commits and makes"
            echo "> \`$PRERELEASE_BRANCH\` diverge from \`$RELEASE_BRANCH\`. Once it is approved and its checks pass,"
            echo "> comment \`/release\` to fast-forward \`$RELEASE_BRANCH\`, tag \`v$VERSION\` and publish the release."
            echo
            echo "## $PACKAGE $VERSION"
            echo
            cat "$RUNNER_TEMP/changelog.md"
          } > "$RUNNER_TEMP/body.md"

          number=$(gh pr list --base "$RELEASE_BRANCH" --head "$PRERELEASE_BRANCH" --state open \
            --json number --jq '.[0].number // empty')

          if [ -z "$number" ]; then
            gh pr create --base "$RELEASE_BRANCH" --head "$PRERELEASE_BRANCH" --title "$title" \
              --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

  release:
    name: release
    runs-on: ubuntu-latest
    needs: credentials
    if: >-
      needs.credentials.outputs.configured == 'true' && (
        (github.event_name == 'workflow_dispatch' && inputs.release)
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && startsWith(github.event.comment.body, '/release')
        )
      )
    concurrency:
      group: release-flow-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: create-app-token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}

      - name: checkout-repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.prerelease-branch }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: checkout-release-tooling
        uses: actions/checkout@v4
        with:
          repository: odoo-odev/odev
          ref: ${{ inputs.tooling-ref }}
          path: .release-tooling
          sparse-checkout: .github/scripts

      - name: check-release
        id: check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ACTOR: ${{ github.actor }}
          COMMENTED_NUMBER: ${{ github.event.issue.number }}
        run: |
          release="origin/$RELEASE_BRANCH"
          number=$(gh pr list --base "$RELEASE_BRANCH" --head "$PRERELEASE_BRANCH" --state open \
            --json number --jq '.[0].number // empty')

          refuse() {
            echo "::error::$1"

            if [ -n "$number" ]; then
              gh pr comment "$number" --body ":x: Cannot release: $1"
            fi

            exit 1
          }

          if [ -z "$number" ]; then
            refuse "there is no open release pull request from '$PRERELEASE_BRANCH' to '$RELEASE_BRANCH'"
          fi

          if [ -n "$COMMENTED_NUMBER" ] && [ "$COMMENTED_NUMBER" != "$number" ]; then
            echo "::notice::Ignoring '/release' on #$COMMENTED_NUMBER, the release pull request is #$number"
            exit 0
          fi

          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq '.permission')

          if [ "$permission" != "admin" ] && [ "$permission" != "write" ]; then
            refuse "@$ACTOR is not allowed to release, write access to the repository is required"
          fi

          pull_request=$(gh pr view "$number" --json headRefOid,reviewDecision,latestReviews,statusCheckRollup)
          revision=$(jq --raw-output '.headRefOid' <<< "$pull_request")

          if [ "$revision" != "$(git rev-parse HEAD)" ]; then
            refuse "the pull request is not in sync with '$PRERELEASE_BRANCH' yet, try again in a moment"
          fi

          if ! git merge-base --is-ancestor "$release" "$revision"; then
            refuse "'$RELEASE_BRANCH' cannot be fast-forwarded to '$PRERELEASE_BRANCH', the branches diverged"
          fi

          approved=$(jq --raw-output '
            (.reviewDecision == "APPROVED" or .reviewDecision == "" or .reviewDecision == null)
            and ([.latestReviews[] | select(.state == "APPROVED")] | length > 0)
            and ([.latestReviews[] | select(.state == "CHANGES_REQUESTED")] | length == 0)
          ' <<< "$pull_request")

          if [ "$approved" != "true" ]; then
            refuse "the pull request is not approved"
          fi

          unsuccessful=$(jq --raw-output '
            [
              .statusCheckRollup[]
              | (if (.conclusion // "") != "" then .conclusion else (.state // "PENDING") end)
              | select(. != "SUCCESS" and . != "SKIPPED" and . != "NEUTRAL")
            ] | length
          ' <<< "$pull_request")

          if [ "$unsuccessful" != "0" ]; then
            refuse "$unsuccessful check(s) did not pass or are still running on $revision"
          fi

          version=$(python3 "$TOOLING" next-version --base "$release" --head HEAD --version-file "$VERSION_FILE")

          if [ -z "$version" ]; then
            refuse "there is nothing to release"
          fi

          python3 "$TOOLING" bump --version-file "$VERSION_FILE" --version "$version"

          if ! git diff --quiet -- "$VERSION_FILE"; then
            refuse "the version was not bumped to $version on '$PRERELEASE_BRANCH' yet, try again in a moment"
          fi

          python3 "$TOOLING" changelog --base "$release" --head HEAD > "$RUNNER_TEMP/changelog.md"

          {
            echo "number=$number"
            echo "revision=$revision"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: publish-release
        if: steps.check.outputs.version
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NUMBER: ${{ steps.check.outputs.number }}
          REVISION: ${{ steps.check.outputs.revision }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # Pushing the very same commits keeps both branches identical: the pull request is marked as merged
          # and the pre-release branch remains untouched, ready for the next changes.
          git push origin "$REVISION:refs/heads/$RELEASE_BRANCH"
          git push origin "$REVISION:refs/tags/v$VERSION"

          gh release create "v$VERSION" --verify-tag --title "$PACKAGE $VERSION" \
            --notes-file "$RUNNER_TEMP/changelog.md"
          gh pr comment "$NUMBER" --body \
            ":rocket: Released as [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION)"

  retarget:
    name: retarget-pull-request
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.pull_request.base.ref == inputs.release-branch
      && (
        github.event.pull_request.head.ref != inputs.prerelease-branch
        || github.event.pull_request.head.repo.full_name != github.repository
      )
      && !contains(github.event.pull_request.labels.*.name, 'hotfix')
    permissions:
      pull-requests: write
    steps:
      # Only calls the API: the code of the pull request is never checked out nor run
      - name: retarget-to-prerelease-branch
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --base "$PRERELEASE_BRANCH"
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Changes are merged into \`$PRERELEASE_BRANCH\` and reach \`$RELEASE_BRANCH\` with the next release: this pull request now targets \`$PRERELEASE_BRANCH\`. You may need to rebase it if it shows unrelated commits."
